[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-mcp-plugin"
dynamic = ["version"]
description = "Authenticated MCP server exposing openHop Repeater telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anquietas86" }]
keywords = ["mcp", "model-context-protocol", "openhop", "meshcore", "repeater", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx2>=2.10",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["build", "pytest", "ruff==0.17.4", "mypy==2.4.1"]

[project.urls]
Homepage = "https://github.com/Anquietas86/openhop-mcp-plugin"
Issues = "https://github.com/Anquietas86/openhop-mcp-plugin/issues"

[project.scripts]
openhop-mcp = "openhop_mcp.server:main"
openhop-mcp-token = "openhop_mcp.tokens:main"

[tool.setuptools.dynamic]
version = { attr = "openhop_mcp.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["openhop_mcp"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.mcp" = ["openhop-plugin.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests and validate_wheel.py
    "S310",   # urllib with fixed local URLs in test helpers
    "S603",   # subprocess in smoke test runs our own interpreter
    "S104",   # binding to all interfaces is gated by allow_insecure_bind
    "RUF001", # en dashes and ellipses in strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
files = ["src/openhop_mcp"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
