name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the wheel, checks it against
# the real Repeater plugin parser, and attaches it to the release so it can be
# installed from the Repeater's Plugins page without a local build.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c 'import openhop_mcp; print(openhop_mcp.__version__)')"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi
      - name: Run tests
        run: |
          python -m pytest -q
          python tests/smoke_test.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Validate wheel against Repeater parser
        env:
          PYTHONPATH: repeater-source
        run: |
          git clone --depth 1 https://github.com/openhop-dev/openhop_repeater.git repeater-source
          python validate_wheel.py
      - name: Attach wheel and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release upload "$TAG" *.whl SHA256SUMS --clobber
