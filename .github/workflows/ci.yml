name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run end-to-end smoke test
        run: python tests/smoke_test.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhop-mcp-wheel-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  validate-wheel:
    # Checks the wheel against the real Repeater plugin manifest parser.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Fetch Repeater source
        # The manifest and storage modules are stdlib-only, so nothing else is installed.
        run: git clone --depth 1 https://github.com/openhop-dev/openhop_repeater.git repeater-source
      - name: Validate wheel
        env:
          PYTHONPATH: repeater-source
        run: python validate_wheel.py
